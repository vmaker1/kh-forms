<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경향뮤지컬콩쿠르 수상확인서 신청서</title>
<meta name="description" content="경향신문사 주최 경향뮤지컬콩쿠르 수상자 본인이 수상확인서를 발급받는 페이지입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f6f2; --sheet:#ffffff; --ink:#16304f; --text:#2b3340;
    --muted:#6b7482; --line:#dcdfe4; --seal:#b3261e; --ok:#1f6b4a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--text);
    font:16px/1.65 "Noto Sans KR",system-ui,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:40px 20px 64px}
  header{text-align:center;margin-bottom:28px}
  .org{font-size:14px;color:var(--muted);margin:0 0 6px}
  h1{font-family:"Nanum Myeongjo",serif;font-weight:800;color:var(--ink);margin:0;line-height:1.35}
  .h-contest{display:block;font-size:20px;font-weight:700;letter-spacing:.04em}
  .h-doc{display:block;font-size:32px;letter-spacing:.12em}
  .lead{margin:0 0 20px;font-size:15px;color:var(--muted)}
  .switch{text-align:center;margin:20px 0 0}
  .switch .linkbtn{padding:4px 0}
  .panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:28px 24px}
  .panel[hidden]{display:none}
  label{display:block;font-size:14px;font-weight:500;color:var(--ink);margin:0 0 6px}
  .field{margin-bottom:18px}
  .hint{font-size:13px;color:var(--muted);margin-top:4px}
  input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text)}
  input:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  select{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text)}
  select:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .btn{width:100%;font:inherit;font-weight:700;padding:14px;border-radius:4px;border:0;
    background:var(--ink);color:#fff;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
  .msg{margin-top:16px;font-size:14px;color:var(--seal);min-height:1em}
  .results{margin-top:24px;display:grid;gap:12px}
  .award{border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .award .info{flex:1}
  .award .t{font-family:"Nanum Myeongjo",serif;font-weight:700;color:var(--ink);font-size:18px}
  .award .s{font-size:14px;color:var(--muted)}
  .award button{font:inherit;font-size:14px;font-weight:700;padding:10px 14px;border-radius:4px;
    border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .award button:disabled{border-color:var(--line);color:var(--muted);cursor:default}
  .stamp{width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);border-radius:3px;
    display:grid;place-items:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:13px;
    transform:rotate(-8deg)}
  @media (prefers-reduced-motion:no-preference){
    .stamp{animation:press .35s ease-out}
    @keyframes press{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  }
  .extra{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
  .extra[hidden]{display:none}
  .opt{font-weight:400;color:var(--muted)}
  .consent{background:#f4f6f9;border-radius:4px;padding:12px 14px}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;color:var(--text);cursor:pointer}
  .check input{width:18px;height:18px;margin-top:3px;flex:none}
  .check em{font-style:normal;color:var(--seal)}
  .linkbtn{background:none;border:0;padding:4px 16px;font:inherit;font-size:13px;color:var(--ink);
    text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .preview{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
  .preview[hidden]{display:none}
  .pv-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .pv-title{font-family:"Nanum Myeongjo",serif;font-weight:800;color:var(--ink);font-size:18px}
  .pv-head .s{font-size:13px;color:var(--muted)}
  .pv-frame{border:1px solid var(--line);background:#fff;box-shadow:0 2px 10px rgba(22,48,79,.08);min-height:120px}
  .pv-frame canvas{display:block}
  .pv-frame iframe{width:100%;height:640px;border:0;display:block}
  .pv-dl{display:block;text-align:center;text-decoration:none;margin-top:14px}
  .pv-mail{margin-top:18px}
  .pv-mail[hidden]{display:none}
  .pv-row{display:grid;grid-template-columns:1fr auto;gap:8px}
  .btn-sm{font:inherit;font-size:14px;font-weight:700;padding:0 16px;border-radius:4px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn-sm:disabled{opacity:.6;cursor:default}
  .verify-card{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
  .verify-card dl{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;margin:14px 0 0;font-size:15px}
  .verify-card dt{color:var(--muted)}
  .verify-card dd{margin:0;color:var(--text);font-weight:500}
  .valid{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700}
  .invalid{color:var(--seal);font-weight:700}
  footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="org">경향신문사</p>
    <h1><span class="h-contest" id="h-contest">경향뮤지컬콩쿠르</span><span class="h-doc" id="h-doc">수상확인서 신청서</span></h1>
  </header>

  <section class="panel" id="p-issue">
    <div class="field">
      <label for="name">이름</label>
      <input id="name" autocomplete="name" placeholder="홍길동">
    </div>
    <div class="field">
      <label for="birth">생년월일 6자리</label>
      <input id="birth" inputmode="numeric" maxlength="6" placeholder="001024">
      <p class="hint">2000년 10월 24일생이면 001024</p>
    </div>
    <button class="btn" id="btn-find">수상 기록 조회</button>
    <p class="msg" id="msg-issue" role="alert"></p>

    <div class="extra" id="extra" hidden>
      <div class="field">
        <label for="to">제출처</label>
        <select id="to"><option value="">선택하세요</option></select>
      </div>
      <div class="field" id="other-box" hidden>
        <label for="other">제출처 직접 입력</label>
        <input id="other" maxlength="40" placeholder="예: OO대학교, OO엔터테인먼트">
      </div>
      <div class="field">
        <label for="aud-select">오디션명 <span class="opt">(해당하는 경우만)</span></label>
        <select id="aud-select"><option value="">해당 없음</option></select>
        <input id="audition" maxlength="60" placeholder="예: 뮤지컬 〈OOO〉 2026 오디션" hidden>
        <p class="hint" id="aud-hint" hidden>목록에 없으면 직접 적어주세요.</p>
      </div>
      <div class="field consent" id="consent-box" hidden>
        <label class="check"><input type="checkbox" id="consent">
          <span>경향신문사가 이 확인서와 수상 정보(이름·대회·부문·수상·오디션명)를 <b id="consent-to"></b> 담당자에게 직접 전달하는 데 동의합니다. <em>(필수)</em></span></label>
        <p class="hint">해당 제작사 오디션 심사 목적으로만 전달돼요.</p>
      </div>
      <p class="hint">제출처와 오디션명은 확인서에 함께 표시돼요. 아래 수상 기록에서 <b>PDF 만들기</b>를 누르세요.</p>
    </div>

    <div class="results" id="results"></div>

    <div class="preview" id="preview" hidden>
      <div class="pv-head">
        <span class="stamp">確</span>
        <div><div class="pv-title" id="pv-title"></div><div class="s" id="pv-no"></div></div>
      </div>
      <div class="pv-frame" id="pv-frame"></div>
      <a class="btn pv-dl" id="pv-download">PDF 내려받기</a>
      <div class="pv-mail" id="pv-mail">
        <label for="email">메일로 받기</label>
        <div class="pv-row">
          <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
          <button class="btn-sm" id="pv-send">메일 보내기</button>
        </div>
        <p class="hint" id="pv-mail-msg"></p>
      </div>
    </div>
  </section>

  <section class="panel" id="p-verify" hidden>
    <p class="lead">제출받은 수상확인서가 경향신문사에서 실제로 발급한 것인지 확인하는 곳입니다.</p>
    <div class="field">
      <label for="vno">발행번호</label>
      <input id="vno" placeholder="제2026-뮤콩-001호">
      <p class="hint">확인서 왼쪽 위의 발행번호를 그대로 입력하세요.</p>
    </div>
    <button class="btn" id="btn-verify">진위 확인</button>
    <p class="msg" id="msg-verify" role="alert"></p>
    <div id="vresult"></div>
  </section>

  <p class="switch">
    <button class="linkbtn" id="to-verify">수상확인서를 제출받은 기관이신가요? 발행번호로 진위 확인</button>
    <button class="linkbtn" id="to-issue" hidden>수상자 본인이신가요? 확인서 신청하기</button>
  </p>

  <footer>
    입력한 정보는 본인 확인에만 사용합니다.<br>
    문의 경향신문사 문화사업국 02-3701-1602
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ───────────────────────────────────────────────
   설정: Apps Script 웹앱 주소(/exec 로 끝나는 주소)
   배포 관리 → 웹 앱 URL 을 그대로 붙여넣으세요.
   ─────────────────────────────────────────────── */
const API_URL = 'https://script.google.com/macros/s/AKfycbwFh1YViSMGBTaOjVKGJ8x1ZZubwqZAtQpDKS6IPAsiJB8oUl7xbC0rnjILxLrM9LAZ8Q/exec';

const $ = id => document.getElementById(id);
let cred = null, mailOn = true, partners = [], auditions = {}, contest = '';

/* Apps Script 호출 (JSONP — 브라우저 보안 설정과 무관하게 동작) */
function api(action, params) {
  return new Promise((resolve, reject) => {
    const cb = 'khcb' + Date.now() + Math.floor(Math.random() * 1e6);
    const q = new URLSearchParams(Object.assign({ action: action, callback: cb }, params || {}));
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('서버 응답이 늦습니다. 잠시 후 다시 시도해 주세요.')); }, 90000);
    function done() { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = res => { done(); (res && res.ok) ? resolve(res.data) : reject(new Error((res && res.error) || '요청을 처리하지 못했습니다.')); };
    s.onerror = () => { done(); reject(new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.')); };
    s.src = API_URL + '?' + q.toString();
    document.body.appendChild(s);
  });
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function showTab(which) {
  const issue = which === 'issue';
  $('p-issue').hidden = !issue;
  $('p-verify').hidden = issue;
  $('to-verify').hidden = !issue;
  $('to-issue').hidden = issue;
  $('h-doc').textContent = issue ? '수상확인서 신청서' : '수상확인서 진위 확인';
}
$('to-verify').onclick = () => { showTab('verify'); $('vno').focus(); };
$('to-issue').onclick = () => { showTab('issue'); $('name').focus(); };

/* 대회명 등 기본 정보 */
api('info').then(info => {
  contest = info.contest || '';
  if (contest) { $('h-contest').textContent = contest; document.title = contest + ' 수상확인서 신청서'; }
  mailOn = info.mail;
}).catch(() => {});

/* 조회 */
$('btn-find').onclick = () => {
  const name = $('name').value.trim(), birth = $('birth').value.trim();
  $('msg-issue').textContent = ''; $('results').innerHTML = '';
  $('extra').hidden = true; $('preview').hidden = true;
  if (!name || !/^\d{6}$/.test(birth)) { $('msg-issue').textContent = '이름과 생년월일 6자리를 입력하세요.'; return; }
  const b = $('btn-find'); b.disabled = true; b.textContent = '조회 중…';
  api('find', { name: name, birth: birth })
    .then(res => {
      b.disabled = false; b.textContent = '수상 기록 조회';
      cred = { name: name, birth: birth };
      mailOn = res.mail; partners = res.partners || []; auditions = res.auditions || {};
      const sel = $('to');
      sel.length = 1;
      (res.options || []).concat(['기타']).forEach(o => { const op = el('option', '', o); op.value = o; sel.appendChild(op); });
      $('extra').hidden = !(res.items && res.items.length);
      (res.items || []).forEach(a => $('results').appendChild(card(a)));
    })
    .catch(err => { b.disabled = false; b.textContent = '수상 기록 조회'; $('msg-issue').textContent = err.message; });
};

function card(a) {
  const box = el('div', 'award');
  const info = el('div', 'info');
  info.appendChild(el('div', 't', '제' + a.round + '회 ' + (a.contest || contest) + ' ' + a.award));
  info.appendChild(el('div', 's', a.deptLabel + (a.team ? ' / ' + a.team : '') + ' / ' + a.date));
  box.appendChild(info);
  const btn = el('button', '', a.ready ? 'PDF 만들기' : '발급 준비 중');
  btn.disabled = !a.ready;
  btn.onclick = () => issue(a, btn);
  box.appendChild(btn);
  return box;
}

function fillAuditions(to) {
  const list = (auditions[to] || []).concat(auditions[''] || []);
  const sel = $('aud-select');
  sel.length = 1;
  list.forEach(n => { const op = el('option', '', n); op.value = n; sel.appendChild(op); });
  const direct = el('option', '', '직접 입력');
  direct.value = '__other__';
  sel.appendChild(direct);
  sel.value = list.length ? '' : '__other__';
  toggleAud();
}

function toggleAud() {
  const direct = $('aud-select').value === '__other__';
  $('audition').hidden = !direct;
  $('aud-hint').hidden = !direct;
  if (!direct) $('audition').value = '';
}
$('aud-select').onchange = toggleAud;

$('to').onchange = () => {
  const v = $('to').value;
  fillAuditions(v);
  $('other-box').hidden = v !== '기타';
  if (v === '기타') $('other').focus();
  const isPartner = partners.indexOf(v) >= 0;
  $('consent-box').hidden = !isPartner;
  $('consent-to').textContent = v;
  $('consent').checked = false;
};

let current = null;   // 지금 미리보기 중인 확인서 {row, fileId}

function issue(a, btn) {
  const purpose = {
    choice: $('to').value,
    other: $('other').value.trim(),
    audition: ($('aud-select').value === '__other__' ? $('audition').value.trim() : $('aud-select').value),
    consent: $('consent').checked
  };
  if (!purpose.choice) { $('msg-issue').textContent = '제출처를 선택하세요.'; $('to').focus(); return; }
  if (purpose.choice === '기타' && !purpose.other) { $('msg-issue').textContent = '제출처를 직접 입력하세요.'; $('other').focus(); return; }
  if (partners.indexOf(purpose.choice) >= 0 && !purpose.consent) { $('msg-issue').textContent = '제출처 전달 동의에 체크해 주세요.'; $('consent').focus(); return; }
  $('msg-issue').textContent = '';
  btn.disabled = true; btn.textContent = '만드는 중…';
  api('issue', { name: cred.name, birth: cred.birth, row: a.row, purpose: JSON.stringify(purpose) })
    .then(res => { btn.disabled = false; btn.textContent = '다시 만들기'; showPreview(a, res); })
    .catch(err => { btn.disabled = false; btn.textContent = 'PDF 만들기'; $('msg-issue').textContent = err.message; });
}

function showPreview(a, res) {
  const bin = atob(res.data), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
  current = { row: a.row, fileId: res.fileId };

  $('pv-title').textContent = '제' + a.round + '회 ' + (a.contest || contest) + ' ' + a.award + ' 수상확인서';
  $('pv-no').textContent = '발행번호 ' + res.no;
  $('pv-download').href = url;
  $('pv-download').download = res.fileName;
  $('pv-mail').hidden = !(res.mail === undefined ? mailOn : res.mail);
  $('pv-mail-msg').textContent = '';
  $('pv-send').disabled = false; $('pv-send').textContent = '메일 보내기';
  $('preview').hidden = false;
  renderPdf(arr.slice(0), url);
  $('preview').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* 첫 장을 그림으로 보여주기 (pdf.js) — 안 되면 브라우저 PDF 보기로 */
function renderPdf(arr, url) {
  const frame = $('pv-frame');
  frame.innerHTML = '';
  const fallback = () => {
    frame.innerHTML = '';
    const f = el('iframe'); f.src = url; f.title = '수상확인서 미리보기'; frame.appendChild(f);
  };
  if (!window.pdfjsLib) return fallback();
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument({ data: arr }).promise
      .then(pdf => pdf.getPage(1))
      .then(page => {
        const cssW = frame.clientWidth || 460;
        const base = page.getViewport({ scale: 1 });
        const dpr = window.devicePixelRatio || 1;
        const vp = page.getViewport({ scale: (cssW / base.width) * dpr });
        const canvas = el('canvas');
        canvas.width = vp.width; canvas.height = vp.height;
        canvas.style.width = cssW + 'px';
        frame.appendChild(canvas);
        return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      })
      .catch(fallback);
  } catch (e) { fallback(); }
}

$('pv-send').onclick = () => {
  const email = $('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { $('pv-mail-msg').textContent = '이메일 주소를 정확히 입력하세요.'; $('email').focus(); return; }
  if (!current) return;
  const b = $('pv-send'); b.disabled = true; b.textContent = '보내는 중…';
  api('send', { name: cred.name, birth: cred.birth, row: current.row, fileId: current.fileId, email: email })
    .then(() => { b.textContent = '보냈어요'; $('pv-mail-msg').textContent = email + ' 로 확인서를 보냈어요.'; })
    .catch(err => { b.disabled = false; b.textContent = '메일 보내기'; $('pv-mail-msg').textContent = err.message; });
};
$('email').addEventListener('input', () => { $('pv-send').disabled = false; $('pv-send').textContent = '메일 보내기'; });

/* 진위 확인 */
function verify() {
  const no = $('vno').value.trim();
  $('msg-verify').textContent = ''; $('vresult').innerHTML = '';
  if (!no) { $('msg-verify').textContent = '발행번호를 입력하세요.'; return; }
  const b = $('btn-verify'); b.disabled = true; b.textContent = '확인 중…';
  api('verify', { no: no })
    .then(r => {
      b.disabled = false; b.textContent = '진위 확인';
      const box = el('div', 'verify-card');
      if (!r) {
        box.appendChild(el('p', 'invalid', '발급 기록이 없는 번호입니다.'));
        box.appendChild(el('p', 'hint', '번호를 다시 확인하거나 사무국에 문의하세요.'));
      } else {
        const v = el('div', 'valid'); v.appendChild(el('span', 'stamp', '確'));
        v.appendChild(el('span', '', '경향신문사가 발급한 확인서입니다.')); box.appendChild(v);
        const dl = el('dl');
        [['발행번호', r.no], ['발급일', r.issued], ['성명', r.name], ['대회', r.contest], ['부문', r.dept]]
          .concat(r.team ? [['팀명', r.team]] : [])
          .concat([['수상', r.award], ['수상일', r.date]])
          .concat(r.to ? [['제출처', r.to]] : [])
          .forEach(pair => { dl.appendChild(el('dt', '', pair[0])); dl.appendChild(el('dd', '', pair[1] || '-')); });
        box.appendChild(dl);
      }
      $('vresult').appendChild(box);
    })
    .catch(err => { b.disabled = false; b.textContent = '진위 확인'; $('msg-verify').textContent = err.message; });
}
$('btn-verify').onclick = verify;

['name', 'birth'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-find').click(); }));
$('vno').addEventListener('keydown', e => { if (e.key === 'Enter') verify(); });

/* 확인서 QR로 들어온 경우: ?v=발행번호 → 진위 확인 화면 */
const PRE = new URLSearchParams(location.search).get('v');
if (PRE) { showTab('verify'); $('vno').value = PRE.slice(0, 40); verify(); }
</script>
</body>
